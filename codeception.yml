actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
bootstrap: _bootstrap.php
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'http://localhost/index.php'
            projectConfig: {}
            migrations: []
            plugins:
                - class: '\heydeacon\deacon\Plugin'
                  handle: deacon
            cleanup: false
            transaction: false
            dbSetup: { clean: true, setupCraft: true }
